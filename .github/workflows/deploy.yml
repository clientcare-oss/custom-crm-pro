name: CI/CD Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-typecheck:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run check

      - name: Run Tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa65a33e99b08d8202d3afa0b305a1c4
        run: npm run test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_aGFwcHktbGlvbmZpc2gtNzAuY2xlcmsuYWNjb3VudHMuZGV2JA
        run: npm run build

      - name: Check Cloudflare Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository secrets!"
            exit 1
          else
            echo "Cloudflare API token detected."
          fi

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fa65a33e99b08d8202d3afa0b305a1c4
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: fa65a33e99b08d8202d3afa0b305a1c4
